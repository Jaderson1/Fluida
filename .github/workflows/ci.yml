name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
        - '22.13.0'
        - '24'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build Dash frontend bundle
        run: pnpm --filter dash-fluida-frontend build

      - name: Verify generated Dash assets are up to date
        run: |
          BUNDLE="python/dash-fluida/src/dash_fluida/dash_fluida.min.js"
          SOURCE_MAP="python/dash-fluida/src/dash_fluida/dash_fluida.min.js.map"

          if ! git diff --quiet -- "$BUNDLE" "$SOURCE_MAP"; then
            echo "::error::$BUNDLE or $SOURCE_MAP is out of date — rebuild with 'pnpm --filter dash-fluida-frontend build' and commit the result."
            git diff --stat -- "$BUNDLE" "$SOURCE_MAP"
            exit 1
          fi

          if ! grep -q "sourceMappingURL=dash_fluida.min.js.map" "$BUNDLE"; then
            echo "::error::$BUNDLE does not reference dash_fluida.min.js.map."
            exit 1
          fi

      - name: Verify the bundle build is deterministic
        run: node python/dash-fluida/scripts/verify-bundle-determinism.mjs

  react-compat:
    name: '@fluida/react against React ${{ matrix.react-version }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # >=18.0.0 is the declared peerDependencies floor; the devDependency
        # pin (react ^19.2.7) is what every other job already tests, so
        # this job's job is specifically the other end of that range.
        react-version:
          - '18.3.1'
          - '19.2.7'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Pin React ${{ matrix.react-version }} and install
        run: |
          cat >> pnpm-workspace.yaml << EOF
          overrides:
            react: ${{ matrix.react-version }}
            react-dom: ${{ matrix.react-version }}
          EOF
          pnpm install --no-frozen-lockfile

      - name: Confirm the pinned version actually installed
        run: |
          INSTALLED=$(node -p "require('./packages/react/node_modules/react/package.json').version")
          echo "Installed React: $INSTALLED"
          if [ "$INSTALLED" != "${{ matrix.react-version }}" ]; then
            echo "::error::Expected React ${{ matrix.react-version }}, got $INSTALLED"
            exit 1
          fi

      - name: Build Core
        run: pnpm --filter @fluida/core build

      - name: Run React tests
        run: pnpm --filter @fluida/react run test

  fluida-core:
    name: fluida-core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        working-directory: python/fluida-core
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: python/fluida-core
        run: python -m pytest -v

      - name: Build sdist and wheel
        working-directory: python/fluida-core
        run: |
          pip install --quiet build
          python -m build

  dash-fluida:
    name: dash-fluida (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: typescript

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core
        run: pnpm --filter @fluida/core build

      - name: Run frontend tests
        run: pnpm --filter dash-fluida-frontend test

      - name: Build frontend bundle
        run: pnpm --filter dash-fluida-frontend build

      - name: Install Python package
        working-directory: python/dash-fluida
        run: pip install -e ".[dev]"

      - name: Run Python tests
        working-directory: python/dash-fluida
        run: python -m pytest -v

      - name: Build sdist and wheel
        working-directory: python/dash-fluida
        run: |
          pip install --quiet build
          python -m build

      - name: Confirm the bundle is included in the wheel
        working-directory: python/dash-fluida
        run: |
          WHEEL=$(ls dist/*.whl)
          unzip -l "$WHEEL" | grep -q "dash_fluida.min.js" || (echo "::error::dash_fluida.min.js missing from wheel" && exit 1)

  dash-e2e:
    name: Dash E2E (real browser)
    runs-on: ubuntu-latest
    needs: typescript
    # Separate job, not a step in dash-fluida above: installing a real
    # browser is slow relative to the rest of the suite, and this is
    # the one job whose failure should point specifically at rendered
    # layout, not at anything else.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install JS dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @fluida/core build
          pnpm --filter dash-fluida-frontend build

      - name: Install Python package with E2E extras
        working-directory: python/dash-fluida
        run: pip install -e ".[e2e]"

      - name: Install Chromium
        working-directory: python/dash-fluida
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: python/dash-fluida
        run: pytest e2e/tests -v
        env:
          FLUIDA_E2E_BROWSERS_AVAILABLE: '1'

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dash-e2e-diagnostics
          path: python/dash-fluida/e2e/diagnostics/
          if-no-files-found: ignore

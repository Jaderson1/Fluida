name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build Dash frontend bundle
        run: pnpm --filter dash-fluida-frontend build

      - name: Verify generated Dash assets are up to date
        run: |
          BUNDLE="python/dash-fluida/src/dash_fluida/dash_fluida.min.js"
          SOURCE_MAP="python/dash-fluida/src/dash_fluida/dash_fluida.min.js.map"

          if ! git diff --quiet -- "$BUNDLE" "$SOURCE_MAP"; then
            echo "::error::$BUNDLE or $SOURCE_MAP is out of date — rebuild with 'pnpm --filter dash-fluida-frontend build' and commit the result."
            git diff --stat -- "$BUNDLE" "$SOURCE_MAP"
            exit 1
          fi

          if ! grep -q "sourceMappingURL=dash_fluida.min.js.map" "$BUNDLE"; then
            echo "::error::$BUNDLE does not reference dash_fluida.min.js.map."
            exit 1
          fi

      - name: Verify the bundle build is deterministic
        run: node python/dash-fluida/scripts/verify-bundle-determinism.mjs

  react-compat:
    name: '@fluida/react against React ${{ matrix.react-version }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        react-version:
          - '18.3.1'
          - '19.2.7'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Override React version
        shell: bash
        run: |
          printf '\n\noverrides:\n  react: "${{ matrix.react-version }}"\n  react-dom: "${{ matrix.react-version }}"\n' >> pnpm-workspace.yaml
          cat pnpm-workspace.yaml

      - name: Install dependencies with React override
        run: pnpm install --no-frozen-lockfile

      - name: Confirm the pinned version actually installed
        shell: bash
        run: |
          INSTALLED=$(node -p "require('./packages/react/node_modules/react/package.json').version")
          echo "Installed React: $INSTALLED"

          if [ "$INSTALLED" != "${{ matrix.react-version }}" ]; then
            echo "::error::Expected React ${{ matrix.react-version }}, got $INSTALLED"
            exit 1
          fi

      - name: Build Core
        run: pnpm --filter @fluida/core build

      - name: Run React tests
        run: pnpm --filter @fluida/react run test

  fluida-core:
    name: fluida-core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        working-directory: python/fluida-core
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: python/fluida-core
        run: python -m pytest -v

      - name: Build sdist and wheel
        working-directory: python/fluida-core
        run: |
          python -m pip install --quiet build
          python -m build

  dash-fluida:
    name: dash-fluida (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: typescript

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core
        run: pnpm --filter @fluida/core build

      - name: Run frontend tests
        run: pnpm --filter dash-fluida-frontend test

      - name: Build frontend bundle
        run: pnpm --filter dash-fluida-frontend build

      - name: Install Python package
        working-directory: python/dash-fluida
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        working-directory: python/dash-fluida
        run: python -m pytest -v

      - name: Build sdist and wheel
        working-directory: python/dash-fluida
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Confirm the bundle is included in the wheel
        working-directory: python/dash-fluida
        shell: bash
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' | head -n 1)

          if [ -z "$WHEEL" ]; then
            echo "::error::No dash-fluida wheel was generated."
            exit 1
          fi

          if ! unzip -l "$WHEEL" | grep -q "dash_fluida.min.js"; then
            echo "::error::dash_fluida.min.js is missing from the wheel."
            exit 1
          fi

          if ! unzip -l "$WHEEL" | grep -q "dash_fluida.min.js.map"; then
            echo "::error::dash_fluida.min.js.map is missing from the wheel."
            exit 1
          fi

  dash-e2e:
    name: Dash E2E (real browser)
    runs-on: ubuntu-latest
    needs: typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install JS dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @fluida/core build
          pnpm --filter dash-fluida-frontend build

      - name: Install Python package and E2E dependencies
        working-directory: python/dash-fluida
        run: |
          python -m pip install -e ".[e2e]"
          python -m pip install pytest-playwright

      - name: Install Chromium
        working-directory: python/dash-fluida
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: python/dash-fluida
        env:
          FLUIDA_E2E_BROWSERS_AVAILABLE: '1'
        run: python -m pytest e2e/tests -v

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dash-e2e-diagnostics
          path: python/dash-fluida/e2e/diagnostics/
          if-no-files-found: ignore

  package-smoke-test:
    name: Package smoke test (consumer, not workspace)
    runs-on: ubuntu-latest
    needs: typescript
    # Packs and installs the real tarballs/wheels in a clean directory
    # outside the monorepo — proves what a consumer would actually get,
    # not just that the source builds inside the workspace.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @fluida/core build
          pnpm --filter @fluida/react build

      - name: Pack npm tarballs
        run: |
          mkdir -p /tmp/npm-smoke
          pnpm --filter @fluida/core pack --pack-destination /tmp/npm-smoke
          pnpm --filter @fluida/react pack --pack-destination /tmp/npm-smoke

      - name: Install tarballs in a clean, isolated project and smoke test
        run: |
          mkdir -p /tmp/smoke-project && cd /tmp/smoke-project
          npm init -y --silent
          npm install --silent /tmp/npm-smoke/fluida-core-*.tgz /tmp/npm-smoke/fluida-react-*.tgz react@19 react-dom@19
          node -e "
            const { computeContainerLayout } = require('@fluida/core');
            const result = computeContainerLayout(800, 600, { itemCount: 4, strategy: 'fit' });
            if (!Number.isFinite(result.columns)) throw new Error('smoke test failed: ' + JSON.stringify(result));
            console.log('npm smoke test OK:', JSON.stringify(result));
          "

      - name: Build Python wheels
        run: |
          python -m venv /tmp/py-build
          /tmp/py-build/bin/pip install --quiet build
          cd python/fluida-core && /tmp/py-build/bin/python -m build
          cd ../dash-fluida && /tmp/py-build/bin/python -m build

      - name: Install wheels in a clean venv and smoke test
        run: |
          python -m venv /tmp/py-smoke
          /tmp/py-smoke/bin/pip install --quiet python/fluida-core/dist/*.whl python/dash-fluida/dist/*.whl
          /tmp/py-smoke/bin/python -c "
          import fluida_core, dash_fluida
          assert fluida_core.__version__, 'fluida_core.__version__ is empty'
          assert dash_fluida.__version__, 'dash_fluida.__version__ is empty'
          r = fluida_core.compute_container_layout(800, 600, item_count=4, strategy='fit')
          assert r.columns > 0
          grid = dash_fluida.FluidaGrid(item_count=4, strategy='fit')
          assert grid.to_plotly_json()['props']['item_count'] == 4
          print('Python smoke test OK:', fluida_core.__version__, dash_fluida.__version__)
          "
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
        - '22.13.0'
        - '24'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build Dash frontend bundle
        run: pnpm --filter dash-fluida-frontend build

      - name: Confirm the rebuilt Dash bundle matches what's committed
        run: |
          if ! git diff --quiet -- python/dash-fluida/src/dash_fluida/dash_fluida.min.js python/dash-fluida/src/dash_fluida/dash_fluida.min.js.map; then
            echo "::error::python/dash-fluida/src/dash_fluida/dash_fluida.min.js(.map) is out of date — rebuild with 'pnpm --filter dash-fluida-frontend build' and commit the result."
            git diff --stat -- python/dash-fluida/src/dash_fluida/
            exit 1
          fi

  fluida-core:
    name: fluida-core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        working-directory: python/fluida-core
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: python/fluida-core
        run: python -m pytest -v

      - name: Build sdist and wheel
        working-directory: python/fluida-core
        run: |
          pip install --quiet build
          python -m build

  dash-fluida:
    name: dash-fluida (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: typescript

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter dash-fluida-frontend test

      - name: Build Core and frontend bundle
        run: |
          pnpm --filter @fluida/core build
          pnpm --filter dash-fluida-frontend build

      - name: Install Python package
        working-directory: python/dash-fluida
        run: pip install -e ".[dev]"

      - name: Run Python tests
        working-directory: python/dash-fluida
        run: python -m pytest -v

      - name: Build sdist and wheel
        working-directory: python/dash-fluida
        run: |
          pip install --quiet build
          python -m build

      - name: Confirm the bundle is included in the wheel
        working-directory: python/dash-fluida
        run: |
          WHEEL=$(ls dist/*.whl)
          unzip -l "$WHEEL" | grep -q "dash_fluida.min.js" || (echo "::error::dash_fluida.min.js missing from wheel" && exit 1)

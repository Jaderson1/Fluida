[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dash-fluida"
version = "0.2.0"
description = "A Dash custom component that measures its real container size in the browser and lays out its children using the same layout engine as @fluida/core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Jaderson Manoel Lichtnow Olson" }
]
keywords = ["dash", "plotly", "layout", "dashboard", "responsive"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: Dash",
]
dependencies = [
  "dash>=2.4"
]

[project.urls]
Homepage = "https://github.com/Jaderson1/Fluida"
Repository = "https://github.com/Jaderson1/Fluida"
Issues = "https://github.com/Jaderson1/Fluida/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dash_fluida"]
# The frontend bundle is generated by `pnpm --filter dash-fluida-frontend run build`
# (tsup, then scripts/copy-bundle.mjs) before this package is built —
# it is not tracked by git as source, so it must be listed explicitly
# as a build artifact for hatchling to include it in the wheel.
artifacts = [
  "src/dash_fluida/dash_fluida.min.js",
  "src/dash_fluida/dash_fluida.min.js.map",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

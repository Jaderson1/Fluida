[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluida-core"
version = "0.2.0"
description = "Framework-agnostic, pure-Python container layout engine — a faithful port of @fluida/core's TypeScript implementation, verified against the same shared conformance cases."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Jaderson Manoel Lichtnow Olson" }
]
keywords = ["layout", "responsive", "dash", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Jaderson1/Fluida"
Repository = "https://github.com/Jaderson1/Fluida"
Issues = "https://github.com/Jaderson1/Fluida/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fluida_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
